# Jetson Orin L4T (5.15-tegra) cellular throughput tuning.
# Stock L4T kernels do not ship tcp_bbr or sch_fq modules; keep default cubic/qdisc
# and raise socket buffer ceilings + MTU probing for high-BDP 5G SA paths.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 262144 16777216
net.ipv4.tcp_wmem = 4096 262144 16777216
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_mtu_probing = 1

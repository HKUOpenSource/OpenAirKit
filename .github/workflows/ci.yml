name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Quick checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/jetson-console/frontend/package-lock.json
            apps/spark-platform/frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-tools.txt \
            -r apps/jetson-console/requirements-dev.txt \
            -r apps/spark-platform/requirements-dev.txt
      - name: Test, build and audit
        run: make ci PYTHON=python

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Jetson
            python: '3.10'
            app: jetson-console
          - name: Spark
            python: '3.12'
            app: spark-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-tools.txt -r apps/${{ matrix.app }}/requirements-dev.txt
      - name: Build frontend
        run: |
          npm ci --prefix apps/${{ matrix.app }}/frontend
          npm run build --prefix apps/${{ matrix.app }}/frontend
      - name: Test backend
        env:
          PYTHONPATH: apps/jetson-console/backend:apps/spark-platform/backend
        run: python -m unittest discover -s apps/${{ matrix.app }}/tests -p 'test_*.py'
      - name: Test stack and release tooling
        run: make test-stack PYTHON=python
      - name: Install browser
        working-directory: apps/${{ matrix.app }}/frontend
        run: npx playwright install --with-deps chromium
      - name: Jetson browser checks
        if: matrix.name == 'Jetson'
        run: make e2e-jetson PYTHON=python
      - name: Spark browser checks
        if: matrix.name == 'Spark'
        run: make e2e-spark PYTHON=python

  audit:
    name: Repository audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make docs-audit release-audit license-audit shell-check PYTHON=python

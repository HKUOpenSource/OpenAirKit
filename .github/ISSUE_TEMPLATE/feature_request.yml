name: Feature request
description: Propose an improvement or new capability for OpenAirKit
title: "[feat] "
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Target component
      options:
        - Spark Console (apps/spark-console)
        - Jetson Console (apps/jetson-console)
        - RAN / Core Stack (stacks/)
        - Deployment / Release Tooling (deploy/, scripts/)
        - Documentation / AI Extensibility
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Motivation and use case
      description: Describe the experimental workflow, operational need, or bottleneck this addresses.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed design
      description: Outline the expected interface, scope, and hardware/safety constraints.
    validations:
      required: true
